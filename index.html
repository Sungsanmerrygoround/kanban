<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10a37f">
<title>Kanban Board</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kanban">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Floating button to reopen sidebar when collapsed -->
<button class="sidebar-open-btn" id="sidebarOpenBtn" title="사이드바 열기" aria-label="사이드바 열기">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<!-- Sidebar backdrop (mobile) -->
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo-mark">⚡</div>
    <div class="workspace-name">Board</div>
    <button class="sidebar-toggle" id="sidebarToggle" title="사이드바 접기" aria-label="사이드바 접기">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
  </div>
  <div class="sidebar-divider"></div>
  <div class="section-title">프로젝트</div>
  <div class="project-list" id="projectList"></div>
  <div class="sidebar-stats" id="sidebarStats"></div>
  <div class="user-chip" id="userChip">
    <div class="user-email"></div>
    <button class="user-logout" id="authLogout" title="로그아웃">⎋</button>
  </div>
  <button class="add-project-btn" id="addProjectBtn">
    <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    새 프로젝트
  </button>
</aside>

<!-- Main area -->
<div class="main">
  <nav class="navbar">
    <div class="project-title">
      <span class="project-title-name" id="projectTitleName">제품 개발</span>
    </div>
    <div class="divider"></div>
    <div class="view-toggle" role="tablist" aria-label="뷰 전환">
      <button class="vt-btn" data-view="board"    role="tab" aria-label="보드 뷰">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="6" height="16" rx="1"/><rect x="11" y="4" width="6" height="10" rx="1"/><rect x="19" y="4" width="2" height="6" rx="1"/></svg>
        <span class="vt-label">보드</span>
      </button>
      <button class="vt-btn" data-view="calendar" role="tab" aria-label="캘린더 뷰">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span class="vt-label">캘린더</span>
      </button>
    </div>
    <div class="divider"></div>
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input class="search-input" id="searchInput" type="text" placeholder="카드 검색..." />
    </div>
    <div class="nav-right">
      <button class="btn notif-btn" id="notifBtn" title="알림 켜기" aria-label="알림">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
      <button class="btn" id="archiveOpenBtn" title="아카이브">
        📦 아카이브
      </button>
      <button class="btn btn-primary" id="addColNavBtn">
        <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        컬럼 추가
      </button>
    </div>
  </nav>

  <div class="board" id="board"></div>
</div>

<!-- Auth overlay (shown when logged out) -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-logo">⚡</div>
    <div class="auth-title">Kanban Board</div>
    <div class="auth-sub">이메일로 로그인하거나 가입하세요</div>
    <input class="auth-input" id="authEmail" type="email" placeholder="이메일" autocomplete="email" />
    <input class="auth-input" id="authPassword" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" />
    <div class="auth-actions">
      <button class="btn btn-primary" id="authSignIn">로그인</button>
      <button class="btn" id="authSignUp">가입</button>
    </div>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- Card edit modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal" data-priority="none">
    <div class="modal-priority-strip"></div>
    <div class="modal-head">
      <div class="modal-head-left">
        <div class="modal-eyebrow" id="mEyebrow">카드 편집</div>
        <div class="modal-title-wrap">
          <input class="modal-title-input" id="mTitle" type="text" placeholder="카드 제목..." />
        </div>
      </div>
      <button class="modal-x" id="modalClose" aria-label="닫기">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="field">
        <div class="notes-header">
          <label class="field-label">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
            노트
          </label>
          <div class="notes-toolbar">
            <span class="notes-hint">Markdown · 이미지 붙여넣기</span>
            <button type="button" class="notes-expand-btn" id="notesExpand" title="전체화면 페이지로 열기">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
              페이지로 열기
            </button>
            <button type="button" class="notes-toggle" id="notesToggle" data-mode="edit">미리보기</button>
          </div>
        </div>
        <textarea class="field-input notes-input" id="mDesc" placeholder="세부 내용, 메모, 링크 등을 자유롭게 적어보세요..." rows="6"></textarea>
        <div class="notes-preview" id="notesPreview" hidden></div>
      </div>

      <div class="field">
        <label class="field-label">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="22" x2="4" y2="15"/><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1"/></svg>
          우선순위
        </label>
        <div class="priority-row">
          <button class="pri-pill" data-p="high">높음</button>
          <button class="pri-pill" data-p="medium">중간</button>
          <button class="pri-pill" data-p="low">낮음</button>
          <button class="pri-pill" data-p="none">없음</button>
        </div>
      </div>

      <div class="field field-row">
        <div class="field-item">
          <label class="field-label">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/></svg>
            컬럼
          </label>
          <select class="col-select" id="mColSelect"></select>
        </div>
        <div class="field-item field-item-wide">
          <label class="field-label">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            기간
          </label>
          <div class="date-range">
            <input type="date" class="field-input date-input" id="mStart" placeholder="시작일" aria-label="시작일" />
            <span class="date-tilde" aria-hidden="true">→</span>
            <input type="date" class="field-input date-input" id="mDue" aria-label="마감일" />
          </div>
        </div>
        <div class="field-item">
          <label class="field-label">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            반복
          </label>
          <select class="col-select" id="mRecurrence">
            <option value="none">반복 없음</option>
            <option value="daily">매일</option>
            <option value="weekly">매주</option>
            <option value="monthly">매월</option>
          </select>
        </div>
      </div>

      <div class="field">
        <div class="checklist-header">
          <label class="field-label">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            체크리스트
          </label>
          <div class="checklist-progress" id="checklistProgress"></div>
        </div>
        <div class="checklist-bar" id="checklistBar"><div class="checklist-bar-fill" id="checklistBarFill"></div></div>
        <div class="checklist-list" id="checklistList"></div>
        <div class="checklist-add">
          <span class="checklist-add-icon">+</span>
          <input class="checklist-add-input" id="checklistInput" type="text" placeholder="새 항목 추가" />
        </div>
      </div>

      <div class="field">
        <label class="field-label">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          태그 <span class="field-hint">Enter로 추가</span>
        </label>
        <div class="tags-box" id="tagsBox">
          <input class="tags-text" id="tagsText" placeholder="태그 입력..." />
        </div>
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn-ghost" id="mDuplicate" title="이 카드를 같은 컬럼에 복제">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        복제
      </button>
      <button class="btn-ghost" id="mSaveTemplate" title="이 카드를 템플릿으로 저장">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        템플릿
      </button>
      <button class="btn-archive" id="mArchive">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        아카이브
      </button>
      <div style="flex:1;"></div>
      <button class="btn-danger" id="mDelete">삭제</button>
      <button class="btn-save" id="mSave">저장</button>
    </div>
  </div>
</div>

<!-- Full-screen Note Page -->
<div class="note-page-overlay" id="notePageOverlay">
  <div class="note-page">
    <div class="np-header">
      <button class="np-back-btn" id="npBack">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        돌아가기
      </button>
      <div class="np-breadcrumb" id="npBreadcrumb"></div>
      <div class="np-view-btns">
        <button class="np-vb active" data-mode="edit">편집</button>
        <button class="np-vb" data-mode="split">분할</button>
        <button class="np-vb" data-mode="preview">미리보기</button>
      </div>
      <button class="np-save-btn" id="npSave">저장</button>
    </div>
    <div class="np-body">
      <div class="np-sidebar">
        <input class="np-title-input" id="npTitle" type="text" placeholder="카드 제목..." />
        <div class="np-meta-group">
          <div class="np-meta-label">우선순위</div>
          <div class="np-priority-row">
            <button class="np-pri-pill" data-p="high">높음</button>
            <button class="np-pri-pill" data-p="medium">중간</button>
            <button class="np-pri-pill" data-p="low">낮음</button>
            <button class="np-pri-pill" data-p="none">없음</button>
          </div>
        </div>
        <div class="np-meta-group">
          <div class="np-meta-label">컬럼</div>
          <select class="np-select" id="npColSelect"></select>
        </div>
        <div class="np-meta-group">
          <div class="np-meta-label">마감일</div>
          <input type="date" class="np-date-input" id="npDue" />
        </div>
        <div class="np-meta-group">
          <div class="np-meta-label">태그 <span class="np-meta-hint">Enter로 추가</span></div>
          <div class="np-tags-box" id="npTagsBox">
            <input class="np-tags-input" id="npTagsText" placeholder="태그 입력..." />
          </div>
        </div>
      </div>
      <div class="np-editor-area mode-edit" id="npEditorArea">
        <textarea class="np-editor" id="npEditor" placeholder="내용을 자유롭게 작성하세요...

Markdown을 지원합니다.
이미지를 붙여넣기(Ctrl+V)할 수도 있어요."></textarea>
        <div class="np-preview-pane" id="npPreviewPane"></div>
      </div>
    </div>
  </div>
</div>

<!-- Archive overlay -->
<div class="overlay" id="archiveOverlay">
  <div class="modal archive-modal">
    <div class="modal-head">
      <div class="modal-headline">📦 아카이브</div>
      <button class="modal-x" id="archiveClose">✕</button>
    </div>
    <div class="archive-list" id="archiveList"></div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
